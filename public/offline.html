<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Holwa offline</title>
    <meta name="theme-color" content="#1d4ed8" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #111827;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(28rem, calc(100% - 2rem));
        padding: 1.5rem;
        border: 1px solid #e5e7eb;
        border-radius: 0.5rem;
        background: #ffffff;
      }

      h1 {
        margin: 0;
        color: #1d4ed8;
        font-size: 1.5rem;
      }

      p {
        margin: 0.75rem 0 0;
        color: #4b5563;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Holwa is offline</h1>
      <p>Reconnect to the internet, then reopen the app to continue.</p>
    </main>
  </body>
</html>
